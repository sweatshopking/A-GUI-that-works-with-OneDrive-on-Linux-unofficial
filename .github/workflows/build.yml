name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev
      - name: Format, lint and test
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --locked --all-targets --features test-driver -- -D warnings
          cargo test --locked

  deb-appimage:
    needs: test
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - run: packaging/build.sh deb-appimage
      - uses: actions/upload-artifact@v4
        with:
          name: deb-appimage
          path: dist/*

  rpm:
    needs: test
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:41
    steps:
      - uses: actions/checkout@v4
      - run: packaging/build.sh rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb-appimage, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
