name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev
      - name: Format, lint and test
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --locked --all-targets --features test-driver -- -D warnings
          cargo test --locked

  # Every package is built natively on x86_64 and arm64 runners, then installed and opened on
  # a fresh system before anything is released.
  deb-appimage:
    needs: test
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v7
      - run: packaging/build.sh deb-appimage
      - uses: actions/upload-artifact@v7
        with:
          name: packages-deb-appimage-${{ matrix.runner }}
          path: dist/*

  rpm:
    needs: test
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: registry.fedoraproject.org/fedora:41
    steps:
      - uses: actions/checkout@v7
      - run: packaging/build.sh rpm
      - uses: actions/upload-artifact@v7
        with:
          name: packages-rpm-${{ matrix.runner }}
          path: dist/*

  smoke-test:
    needs: [deb-appimage, rpm]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        kind: [deb, rpm, appimage]
        include:
          - kind: deb
            image: ubuntu:24.04
          - kind: rpm
            image: registry.fedoraproject.org/fedora:43
          - kind: appimage
            image: ubuntu:24.04
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - run: packaging/smoke-test.sh ${{ matrix.kind }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.kind }}-${{ matrix.runner }}
          path: dist/smoke-*.png

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Source of the bundled sync engine
        # attached so its exact source stays available with the binaries, as the GPL asks,
        # even if the upstream tag ever goes away
        run: |
          tag="$(sed -n 's/^ONEDRIVE_TAG="${ONEDRIVE_TAG:-\(.*\)}"/\1/p' packaging/build.sh)"
          curl -fsSL -o "dist/onedrive-${tag}-source.tar.gz" "https://github.com/abraunegg/onedrive/archive/refs/tags/${tag}.tar.gz"
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(sed -n 's/^ONEDRIVE_TAG="${ONEDRIVE_TAG:-\(.*\)}"/\1/p' packaging/build.sh)"
          cat > notes.md <<EOF
          **Which file do I need?** Most PCs are x86_64 (amd64). Raspberry Pi and other ARM computers use aarch64 (arm64).

          - Ubuntu, Linux Mint, Debian, Pop!_OS, Zorin: the \`.deb\`
          - Fedora, openSUSE: the \`.rpm\`
          - Anything else: the \`.AppImage\`

          These packages include the [OneDrive Client for Linux](https://github.com/abraunegg/onedrive) by abraunegg (GPL-3.0), built unmodified from [its ${tag} source](https://github.com/abraunegg/onedrive/tree/${tag}) (a copy is attached below as \`onedrive-${tag}-source.tar.gz\`). Source for this app is the tagged code in this repository. See [THIRD-PARTY.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/packaging/THIRD-PARTY.md) for everything else bundled.

          Not made by or affiliated with Microsoft.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
