[package]
name = "drivedeck"
version = "0.4.1"
edition = "2024"
description = "DriveDeck for OneDrive: the easiest, most complete way to use OneDrive on Linux"
license = "GPL-3.0-or-later"
authors = ["sweatshopking"]
repository = "https://github.com/sweatshopking/DriveDeck"
homepage = "https://github.com/sweatshopking/DriveDeck"
readme = "README.md"
keywords = ["onedrive", "sharepoint", "sync", "tray", "linux"]
categories = ["gui"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ksni = { version = "0.3.6", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "unstable-winit-030", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2"] }
ureq = { version = "3.4.2", features = ["json"] }
libc = "0.2"
zbus = "5.19"
# the blur behind the see-through window (src/glass.rs); all already used by Slint's winit backend
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[features]
# scripted UI driver used by the automated tests (see src/testdrive.rs)
test-driver = []

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
lto = "thin"
strip = true

# ksni with ProvideXdgActivationToken (vendor/ksni/README.vendored)
[patch.crates-io]
ksni = { path = "vendor/ksni" }
